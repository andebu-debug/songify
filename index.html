<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songify</title>
<meta name="theme-color" content="#141017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songify">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f1ec,#141017);--pan:light-dark(#fffdfb,#1e1922);--pan2:light-dark(#ece3da,#2a2330);--ink:light-dark(#1b1418,#f5eee9);--mut:light-dark(#6a5f66,#a99ea7);--acc:light-dark(#cf3d17,#ff6a3d);--on:light-dark(#fff,#1b0d08);--line:light-dark(#e2d7cd,#2f2834)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;padding-bottom:130px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2{line-height:1.05;margin:0;text-wrap:balance}
svg{display:block}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px) 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;margin-right:auto}
.logo img{width:36px;height:36px;border-radius:9px}
.search{flex:1 1 220px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--pan2);border-radius:999px;padding:0 16px;height:44px;color:var(--mut);order:3}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:600;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--pan2);color:var(--ink)}
.btn:disabled{opacity:.6}
.acc{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px}
.tabs{display:flex;gap:8px;padding:0 max(4vw,16px) 10px;overflow-x:auto;background:var(--bg)}
.tabs button{flex:none;height:40px;padding:0 18px;border-radius:999px;background:var(--pan2);font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{padding:6px max(4vw,16px) 24px;max-width:1240px;margin:0 auto}
.hero{display:flex;gap:24px;align-items:flex-end;padding:clamp(20px,3vw,32px);border-radius:22px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,hsl(var(--h) 70% 46%),hsl(calc(var(--h) + 45) 60% 22%))}
.hero .art{width:clamp(110px,18vw,180px);height:auto;aspect-ratio:1;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:56px;flex:none}
.hero .art svg{width:45%;height:45%}
.hero h1{font-size:clamp(32px,5vw,52px)}
.kind{margin:0 0 6px;font-size:14px;opacity:.85}
.hero p{margin:6px 0 0}
.hb{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.back{height:44px;color:var(--mut);font-weight:500;margin-bottom:6px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 48px minmax(0,1fr) minmax(0,.6fr) 44px 52px 44px;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--pan2)}
.row.cur b{color:var(--acc)}
.row.dim{opacity:.55}
.n{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.cv{width:48px;height:48px;border-radius:8px;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#fff;font-size:20px;flex:none}
.gen{background:linear-gradient(135deg,hsl(var(--h) 75% 56%),hsl(calc(var(--h) + 50) 65% 28%))}
.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt b{font-weight:500}
.tt small,.al,.du{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--pan2);color:var(--ink);margin-right:6px;line-height:18px;vertical-align:1px}
.tag.f{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du{text-align:right;font-variant-numeric:tabular-nums}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--mut);position:relative}
.ic svg{width:22px;height:22px}
.ic:hover{color:var(--ink)}
.ic.on,.heart.on{color:var(--acc)}
.badge{position:absolute;top:6px;right:5px;font-size:10px;font-weight:700;background:var(--acc);color:var(--on);border-radius:8px;padding:0 4px;line-height:14px}
.none{color:var(--mut);padding:24px 8px}
.meter{color:var(--mut);font-size:14px;margin:22px 8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{text-align:left;padding:12px;border-radius:16px;background:var(--pan);border:1px solid var(--line)}
.card:hover{background:var(--pan2)}
.card .cv{width:100%;height:auto;aspect-ratio:1;font-size:48px;margin-bottom:10px;border-radius:10px}
.card .cv svg{width:40%;height:40%}
.card b,.card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mut);font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.head h1{font-size:clamp(32px,5vw,48px)}.head p{margin:6px 0 0;color:var(--mut)}
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(24px,5vw,64px) 0}
.empty h1{font-size:clamp(34px,5vw,52px);margin-bottom:14px}
.empty p{color:var(--mut);max-width:52ch}
.vinyl{width:100%;max-width:380px;margin:auto;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{color:var(--mut);padding:60px 8px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--pan);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:10px max(3vw,12px) calc(10px + env(safe-area-inset-bottom))}
.now{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px}
.now .tt{flex:1;text-align:left}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.btns{display:flex;align-items:center;gap:4px}
.play{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.i-pause,.playing .i-play{display:none}.playing .i-pause{display:block}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog span{min-width:36px}.prog span:last-child{text-align:right}
input[type=range]{accent-color:var(--acc);width:100%;height:24px;margin:0}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.vol input{max-width:130px}
.mini{display:none}
.np{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));overflow:auto;background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--h,20) 70% 50%) 45%,var(--bg)),var(--bg) 68%)}
.np .tophd{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.np .art{width:min(80vw,46vh,440px);height:auto;aspect-ratio:1;border-radius:18px;box-shadow:0 26px 60px rgba(0,0,0,.35);font-size:110px}
.np .info{width:100%;max-width:460px;display:flex;align-items:center;gap:8px}
.np .info .tt{flex:1}.np .info b{font-size:24px;font-weight:600}.np .info small{font-size:16px}
.np .prog,.np .btns,.np .vol{width:100%;max-width:460px}
.np .btns{justify-content:space-between}
.np .play{width:68px;height:68px}.np .play svg{width:32px;height:32px}
.np .vol{justify-content:center}.np .vol input{max-width:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,6,12,.55);display:grid;place-items:end center}
.sheet{background:var(--pan);width:min(100%,460px);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:24px;margin-bottom:14px}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lbl{color:var(--mut);font-size:14px;margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.opts button{height:40px;padding:0 14px;border-radius:999px;background:var(--pan2)}
.line{display:block;width:100%;text-align:left;min-height:48px;padding:0 10px;border-radius:10px}
.line:hover{background:var(--pan2)}
.danger{color:#e5484d}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.field input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--pan2);margin:10px 0}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:1px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.drop{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--acc) 85%,transparent);color:#fff;display:grid;place-items:center;font-size:clamp(26px,4vw,40px);font-weight:700;pointer-events:none}
.toast{position:fixed;left:50%;bottom:140px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:50;transition:.25s;font-size:15px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.acard{width:min(100%,420px);text-align:center}
.acard .vinyl{max-width:180px;margin-bottom:20px}
.acard h1{font-size:clamp(34px,6vw,46px);margin-bottom:8px}
.acard p{color:var(--mut);margin:0 0 20px}
.acard form{text-align:left}
.acard .btn{width:100%;margin-top:4px}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.links button{color:var(--acc);font-weight:500;min-height:44px}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--pan2);font-size:15px;text-align:left}
.msg.err{background:color-mix(in srgb,#e5484d 18%,transparent)}
.setup{max-width:560px;margin:60px auto;padding:0 20px}
@media(max-width:700px){
 .row{grid-template-columns:48px minmax(0,1fr) 44px 44px;gap:10px;padding:6px 4px}.n,.al,.du{display:none}
 .hero{flex-direction:column;align-items:flex-start}
 .empty{grid-template-columns:1fr}.empty .vinyl{max-width:200px}
 .bar{grid-template-columns:minmax(0,1fr) auto;padding-top:12px}
 .bar .prog,.bar .vol,.bar .side{display:none}
 .mini{display:block;position:absolute;top:0;left:0;height:3px;background:var(--acc)}
 .top .btn span{display:none}.top .btn{padding:0 14px}
 .search{max-width:none}
}
@media(prefers-reduced-motion:reduce){.vinyl{animation:none}.toast{transition:none}}
</style></head><body>

<div class="setup" id="setup" hidden><h1>Nesten klar!</h1><p>Appen mangler koblingen til Supabase. Åpne filen <b>config.js</b>, lim inn Project URL og anon key fra Supabase, og send endringen til GitHub (Commit og Push origin).</p></div>

<section class="auth" id="auth">
  <div class="acard"><div id="avinyl"></div><h1>Songify</h1><p id="asub">Starter appen …</p></div>
</section>

<div id="app" hidden>
<header class="top">
  <div class="logo"><img src="/icon-192.png" alt="">Songify</div>
  <button class="btn" id="up" aria-label="Last opp låter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/></svg><span>Last opp</span></button>
  <button class="acc" id="acc" aria-label="Kontoen min"></button>
  <label class="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Søk etter låt, artist eller album" aria-label="Søk"></label>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus" multiple hidden>
</header>
<nav class="tabs"><button data-tab="mine">Mitt bibliotek</button><button data-tab="liked">Likte låter</button><button data-tab="pl">Spillelister</button><button data-tab="shared">Felles</button><button data-tab="all" id="taball" hidden>Alle brukere</button></nav>
<main id="view"><p class="loading">Henter låtene dine …</p></main>
</div>

<footer class="bar" id="bar" hidden>
  <div class="mini" id="mini"></div>
  <div class="now"><button data-pc="open" aria-label="Åpne spiller" id="bcov"></button><button class="tt" data-pc="open"><b id="btitle"></b><small id="bart"></small></button><button class="ic heart side" data-pc="like" aria-label="Lik låten"></button></div>
  <div class="ctl">
    <div class="btns"><button class="ic side" data-pc="shuf" aria-label="Tilfeldig rekkefølge"></button><button class="ic side" data-pc="prev" aria-label="Forrige"></button><button class="play" data-pc="play" aria-label="Spill / pause"></button><button class="ic" data-pc="next" aria-label="Neste"></button><button class="ic side" data-pc="rep" aria-label="Gjenta"></button></div>
    <div class="prog"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Spol"><span class="tdur">0:00</span></div>
  </div>
  <div class="vol"><span class="ic vi"></span><input class="volr" type="range" min="0" max="100" value="90" aria-label="Volum"></div>
</footer>

<section class="np" id="np" hidden>
  <div class="tophd"><button class="ic" data-pc="close" aria-label="Lukk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button><span>Spilles nå</span><span style="width:44px"></span></div>
  <div id="npart"></div>
  <div class="info"><div class="tt"><b id="ntitle"></b><small id="nart"></small></div><button class="ic heart" data-pc="like" aria-label="Lik låten"></button></div>
  <div class="prog"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Spol"><span class="tdur">0:00</span></div>
  <div class="btns"><button class="ic" data-pc="shuf" aria-label="Tilfeldig rekkefølge"></button><button class="ic" data-pc="prev" aria-label="Forrige"></button><button class="play" data-pc="play" aria-label="Spill / pause"></button><button class="ic" data-pc="next" aria-label="Neste"></button><button class="ic" data-pc="rep" aria-label="Gjenta"></button></div>
  <div class="vol"><span class="ic vi"></span><input class="volr" type="range" min="0" max="100" value="90" aria-label="Volum"></div>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="drop" id="drop" hidden>Slipp låtene her</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
{
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')};
const long=t=>{const h=Math.floor(t/3600),m=Math.round(t%3600/60);return h?`${h} t ${m} min`:`${m} min`};
const hue=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const sv=p=>`<svg viewBox="0 0 24 24" fill="currentColor">${p}</svg>`;
const I={
 play:sv('<path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/>'),
 pause:sv('<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>'),
 next:sv('<path d="M5 6.2v11.6a.9.9 0 0 0 1.4.75L15 12.75a.9.9 0 0 0 0-1.5L6.4 5.45A.9.9 0 0 0 5 6.2z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1"/>'),
 prev:sv('<path d="M19 6.2v11.6a.9.9 0 0 1-1.4.75L9 12.75a.9.9 0 0 1 0-1.5l8.6-5.8A.9.9 0 0 1 19 6.2z"/><rect x="4.9" y="5" width="2.6" height="14" rx="1"/>'),
 shuf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M15 15l5 5M4 4l5 5"/></svg>',
 rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.2-9.4C1.6 7 4 4 7.2 4c2 0 3.6 1.1 4.8 2.9C13.2 5.1 14.8 4 16.8 4 20 4 22.4 7 21.2 10.6 19.5 15.4 12 20 12 20z"/></svg>',
 heartF:sv('<path d="M12 20s-7.5-4.6-9.2-9.4C1.6 7 4 4 7.2 4c2 0 3.6 1.1 4.8 2.9C13.2 5.1 14.8 4 16.8 4 20 4 22.4 7 21.2 10.6 19.5 15.4 12 20 12 20z"/>'),
 more:sv('<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>'),
 people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.8"/><path d="M16 14.2a5.5 5.5 0 0 1 5.5 5.8"/></svg>',
 vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>'
};
$$('[data-pc=play]').forEach(b=>b.innerHTML=`<span class="i-play">${I.play}</span><span class="i-pause">${I.pause}</span>`);
$$('[data-pc=next]').forEach(b=>b.innerHTML=I.next);$$('[data-pc=prev]').forEach(b=>b.innerHTML=I.prev);
$$('[data-pc=shuf]').forEach(b=>b.innerHTML=I.shuf);$$('[data-pc=rep]').forEach(b=>b.innerHTML=I.rep+'<span class="badge" hidden>1</span>');
$$('.vi').forEach(b=>b.innerHTML=I.vol);
const VINYL=`<svg class="vinyl" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="98" fill="#16121a"/>${[88,80,72,64,56,48].map(r=>`<circle cx="100" cy="100" r="${r}" fill="none" stroke="#fff" stroke-opacity=".07"/>`).join('')}<path d="M40 60a75 75 0 0 1 40-32" stroke="#fff" stroke-opacity=".22" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="100" cy="100" r="34" fill="var(--acc)"/><circle cx="100" cy="100" r="24" fill="none" stroke="#fff" stroke-opacity=".35"/><circle cx="100" cy="100" r="5" fill="var(--bg)"/></svg>`;
$('#avinyl').innerHTML=VINYL;

/* ---------- melding ---------- */
let tt;function toast(t,stay){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);if(!stay)tt=setTimeout(()=>el.classList.remove('show'),2800)}

/* signerte lenker til filene (gyldige i 12 timer) */
const signed=new Map();
const fresh=p=>{const x=signed.get(p);return x&&x.exp>Date.now()+120000?x.u:null};
async function signMany(paths){
  paths=[...new Set(paths.filter(p=>p&&!fresh(p)))];
  for(let i=0;i<paths.length;i+=200){
    const {data}=await sb.storage.from(B).createSignedUrls(paths.slice(i,i+200),43200);
    (data||[]).forEach(d=>{if(d.signedUrl&&!d.error)signed.set(d.path,{u:d.signedUrl,exp:Date.now()+43200e3})});
  }
}
async function signOne(p){const u=fresh(p);if(u)return u;const {data,error}=await sb.storage.from(B).createSignedUrl(p,43200);if(error)throw error;signed.set(p,{u:data.signedUrl,exp:Date.now()+43200e3});return data.signedUrl}
const cov=(s,cls='cv')=>{const u=s&&s.cover_path&&fresh(s.cover_path);return u?`<img class="${cls}" src="${esc(u)}" alt="" loading="lazy">`:`<div class="${cls} gen" style="--h:${hue((s&&(s.album||s.title))||'x')}">${esc(((s&&s.title)||'?').trim().charAt(0).toUpperCase()||'?')}</div>`};

/* ---------- ID3: navn, artist, album og cover fra MP3 ---------- */
const syncsafe=(b,i)=>(b[i]&127)<<21|(b[i+1]&127)<<14|(b[i+2]&127)<<7|(b[i+3]&127);
const be32=(b,i)=>(b[i]<<24|b[i+1]<<16|b[i+2]<<8|b[i+3])>>>0;
const dec=(d,enc)=>{try{const lab=enc===1?'utf-16':enc===2?'utf-16be':enc===3?'utf-8':'iso-8859-1';return new TextDecoder(lab).decode(d).replace(/\u0000/g,' ').trim()}catch{return ''}};
async function readTags(file){
  const b=new Uint8Array(await file.slice(0,Math.min(file.size,3e6)).arrayBuffer());
  if(b[0]!==73||b[1]!==68||b[2]!==51)return {};
  const ver=b[3];if(ver<3)return {};
  const end=Math.min(10+syncsafe(b,6),b.length);let p=10;const o={};
  if(b[5]&64)p+=ver===4?syncsafe(b,10):be32(b,10)+4;
  while(p+10<end){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const fs=ver===4?syncsafe(b,p+4):be32(b,p+4);const d=b.subarray(p+10,p+10+fs);p+=10+fs;if(!fs)continue;
    if(id==='TIT2')o.title=dec(d.subarray(1),d[0]);else if(id==='TPE1')o.artist=dec(d.subarray(1),d[0]);else if(id==='TALB')o.album=dec(d.subarray(1),d[0]);
    else if(id==='APIC'&&!o.cover){
      const enc=d[0];let i=1;while(i<d.length&&d[i]!==0)i++;
      let mime=dec(d.subarray(1,i),0)||'image/jpeg';if(!mime.includes('/'))mime='image/'+mime.toLowerCase().replace('jpg','jpeg');
      i+=2;
      if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
      if(i<d.length)o.cover=new Blob([d.slice(i)],{type:mime});
    }
  }
  return o;
}
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);let done=false;const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(u);r(isFinite(v)?v:0)};a.preload='metadata';a.onloadedmetadata=()=>fin(a.duration);a.onerror=()=>fin(0);setTimeout(()=>fin(0),6000);a.src=u});
const MIME={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',flac:'audio/flac',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',webm:'audio/webm'};

/* ---------- opplasting ---------- */
const AUD=/\.(mp3|m4a|aac|wav|flac|ogg|oga|opus|webm)$/i;
let busy=false;
async function addFiles(list){
  if(!me)return;
  if(busy){toast('Vent til forrige opplasting er ferdig');return}
  const files=[...list].filter(f=>f.type.startsWith('audio/')||AUD.test(f.name));
  if(!files.length){toast('Fant ingen lydfiler – prøv MP3, M4A, WAV eller FLAC');return}
  busy=true;let n=0,big=0,fail=0;const share=admin&&shareNew;
  for(const [k,f] of files.entries()){
    if(f.size>50*1048576){big++;continue}
    toast(`Laster opp ${k+1} av ${files.length} …`,true);
    try{
      let t={};try{t=await readTags(f)}catch{}
      const base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');const cut=base.indexOf(' - ');
      const [fa,ft]=cut>0?[base.slice(0,cut),base.slice(cut+3)]:['',base];
      const id=crypto.randomUUID(),ext=(f.name.match(/\.([a-z0-9]+)$/i)||[,'mp3'])[1].toLowerCase();
      const path=`${me.id}/${id}.${ext}`,type=(f.type&&f.type.startsWith('audio/'))?f.type:(MIME[ext]||'audio/mpeg');
      const up=await sb.storage.from(B).upload(path,f,{contentType:type,upsert:false});if(up.error)throw up.error;
      let cpath=null;
      if(t.cover){const ce=t.cover.type.includes('png')?'png':'jpg';cpath=`${me.id}/${id}-cover.${ce}`;const cu=await sb.storage.from(B).upload(cpath,t.cover,{contentType:t.cover.type,upsert:false});if(cu.error)cpath=null;else signed.set(cpath,{u:URL.createObjectURL(t.cover),exp:Infinity})}
      const row={id,title:(t.title||ft).trim()||'Uten navn',artist:(t.artist||fa).trim(),album:(t.album||'').trim(),duration:await dur(f),size:f.size,file_path:path,cover_path:cpath,shared:share};
      const {data,error}=await sb.from('ml_songs').insert(row).select().single();
      if(error){sb.storage.from(B).remove([path,cpath].filter(Boolean));throw error}
      S.songs.unshift(data);n++;render();
    }catch(e){fail++;console.error(e)}
  }
  busy=false;
  signMany(S.songs.slice(0,n).map(s=>s.file_path));
  const parts=[];if(n)parts.push(`${n} ${n===1?'låt':'låter'} lagt til${share?' og delt med alle':''}`);if(big)parts.push(`${big} var over 50 MB`);if(fail)parts.push(`${fail} feilet`);
  toast(parts.join(' · ')||'Ingen låter lagt til');
}

$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};

addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;$('#drop').hidden=true;if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

const library=()=>S.songs.filter(s=>mine(s)||(s.shared&&!S.hidden.has(s.id)));
function visible(){
  let L;
  if(S.tab==='liked')L=S.songs.filter(s=>S.likes.has(s.id));
  else if(S.tab==='pl'&&S.pl){const p=S.pls.find(p=>p.id===S.pl);L=p?p.song_ids.map(song).filter(Boolean):[]}
  else if(S.tab==='shared')L=S.songs.filter(s=>s.shared);
  else if(S.tab==='all')L=[...S.songs];
  else L=library();
  const q=S.q.trim().toLowerCase();
  return q?L.filter(s=>(s.title+' '+s.artist+' '+s.album+' '+(S.people[s.owner]||'')).toLowerCase().includes(q)):L;
}

  $$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));

  }
  if(S.tab==='pl'&&!S.pl){
    v.innerHTML=`<div class="head"><div><h1>Spillelister</h1><p>${S.pls.length} ${S.pls.length===1?'liste':'lister'}</p></div><button class="btn" data-act="newpl">+ Ny spilleliste</button></div>
    <div class="grid"><button class="card" data-act="liked"><div class="cv gen" style="--h:345">${I.heartF}</div><b>Likte låter</b><small>${S.likes.size} låter</small></button>
    ${S.pls.map(p=>{const f=song(p.song_ids[0]);return `<button class="card" data-act="openpl" data-p="${esc(p.id)}">${f?cov(f):`<div class="cv gen" style="--h:${hue(p.name)}">${esc(p.name.charAt(0).toUpperCase())}</div>`}<b>${esc(p.name)}</b><small>${p.song_ids.filter(song).length} låter</small></button>`}).join('')}</div>`;
    return;
  }
  const pl=S.tab==='pl'?S.pls.find(p=>p.id===S.pl):null;
  if(S.tab==='pl'&&!pl){S.pl=null;return render()}
  const L=visible(),tot=L.reduce((a,s)=>a+(s.duration||0),0);
  const meta={mine:['Biblioteket ditt','Mitt bibliotek',18],liked:['Biblioteket ditt','Likte låter',345],shared:['Delt med alle','Felles låter',200],all:['Kun for admin','Alle brukeres låter',265]}[S.tab]||['Spilleliste',pl.name,hue(pl.name)];
  const first=pl&&song(pl.song_ids[0]);
  const art=first?cov(first,'cv art'):`<div class="cv art gen" style="--h:${meta[2]}">${S.tab==='liked'?I.heartF:S.tab==='shared'||S.tab==='all'?I.people:pl?esc(pl.name.charAt(0).toUpperCase()):'♪'}</div>`;
  const mb=(library().filter(mine).reduce((a,s)=>a+(s.size||0),0)/1048576).toFixed(0);
  v.innerHTML=`${pl?'<button class="back" data-act="back">← Alle spillelister</button>':''}
  <section class="hero" style="--h:${meta[2]}">${art}<div><p class="kind">${meta[0]}</p><h1>${esc(meta[1])}</h1><p>${L.length} ${L.length===1?'låt':'låter'} · ${long(tot)}${S.q?` · søk: «${esc(S.q)}»`:''}</p>
  <div class="hb"><button class="btn" data-act="playall">${I.play} Spill</button><button class="btn ghost" data-act="shuffleall">${I.shuf} Tilfeldig</button>${pl?'<button class="btn ghost" data-act="renpl">Gi nytt navn</button><button class="btn ghost" data-act="delpl">Slett liste</button>':''}</div></div></section>
  ${L.length?`<ol class="rows">${L.map((s,i)=>{
    const hid=s.shared&&!mine(s)&&S.hidden.has(s.id);
    const tags=(s.shared?'<span class="tag f">Felles</span>':'')+(hid?'<span class="tag">Ikke i biblioteket ditt</span>':'')+(S.tab==='all'?`<span class="tag">${esc(mine(s)?'Deg':(S.people[s.owner]||'Bruker '+s.owner.slice(0,4)))}</span>`:'');
    const liked=S.likes.has(s.id);
    return `<li class="row${s.id===curId()?' cur':''}${hid?' dim':''}" data-id="${esc(s.id)}" data-i="${i}"><span class="n">${i+1}</span>${cov(s)}<div class="tt"><b>${esc(s.title)}</b><small>${tags}${esc(s.artist||'Ukjent artist')}</small></div><span class="al">${esc(s.album)}</span><button class="ic heart${liked?' on':''}" data-act="like" aria-label="Lik">${liked?I.heartF:I.heart}</button><span class="du">${fmt(s.duration)}</span><button class="ic" data-act="more" aria-label="Flere valg">${I.more}</button></li>`}).join('')}</ol>`
  :`<p class="none">${S.q?'Ingen låter passer søket ditt.':pl?'Lista er tom. Trykk på ••• ved en låt for å legge den til her.':S.tab==='liked'?'Du har ikke likt noen låter ennå. Trykk på hjertet ved en låt.':S.tab==='shared'?'Ingen felles låter ennå.':'Ingen låter her ennå.'}</p>`}
  <p class="meter">${library().length} låter i biblioteket ditt · ${mb} MB lastet opp av deg</p>`;
}
const setTab=t=>{S.tab=t;S.pl=null;render();scrollTo(0,0)};
$$('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#q').addEventListener('input',e=>{S.q=e.target.value;if(S.tab==='pl'&&!S.pl)S.tab='mine';render()});
$('#view').addEventListener('click',e=>{

/* ---------- handlinger ---------- */
async function like(id){
  const on=!S.likes.has(id);on?S.likes.add(id):S.likes.delete(id);render();now();
  const r=on?await sb.from('ml_likes').insert({song_id:id}):await sb.from('ml_likes').delete().eq('song_id',id).eq('user_id',me.id);
  if(r.error){on?S.likes.delete(id):S.likes.add(id);render();now();toast('Kunne ikke lagre')}
}
async function hide(id,on){
  const r=on?await sb.from('ml_hidden').insert({song_id:id}):await sb.from('ml_hidden').delete().eq('song_id',id).eq('user_id',me.id);
  if(r.error)return toast('Kunne ikke lagre');
  on?S.hidden.add(id):S.hidden.delete(id);toast(on?'Fjernet fra biblioteket ditt':'Lagt tilbake i biblioteket ditt');render();
}
async function savePl(p){const {error}=await sb.from('ml_playlists').update({name:p.name,song_ids:p.song_ids}).eq('id',p.id);if(error)toast('Kunne ikke lagre spillelista')}
function more(id){
  const s=song(id);if(!s)return;
  const own=mine(s),hid=s.shared&&!own&&S.hidden.has(id),inPl=S.tab==='pl'&&S.pl;
  modal(`<div class="mh">${cov(s)}<div class="tt"><b>${esc(s.title)}</b><small>${esc(s.artist||'Ukjent artist')}</small></div></div>
  <p class="lbl">Legg til i spilleliste</p><div class="opts">${S.pls.map(p=>`<button data-m="add" data-p="${esc(p.id)}">${esc(p.name)}</button>`).join('')}<button data-m="newadd">+ Ny spilleliste</button></div>
  ${curId()?'<button class="line" data-m="next">Spill som neste</button>':''}
  ${inPl?'<button class="line" data-m="rm">Fjern fra denne spillelisten</button>':''}
  ${own||admin?'<button class="line" data-m="edit">Endre navn, artist og album</button>':''}
  ${admin?`<button class="line" data-m="share">${s.shared?'Slutt å dele med alle':'Del med alle (gjør til felles låt)'}</button>`:''}
  ${hid?'<button class="line" data-m="unhide">Legg tilbake i biblioteket mitt</button>':''}
  ${s.shared&&!own&&!hid?'<button class="line danger" data-m="hide">Fjern fra biblioteket mitt</button>':''}
  ${own||admin?`<button class="line danger" data-m="del">${own?'Slett låten':'Slett låten for godt (admin)'}</button>`:''}
  <button class="line" data-m="close">Lukk</button>`,{act:async(m,b)=>{
    if(m==='add'){const p=S.pls.find(p=>p.id===b.dataset.p);if(!p)return;close();if(p.song_ids.includes(id))return toast('Låten er allerede i «'+p.name+'»');p.song_ids=[...p.song_ids,id];render();await savePl(p);toast('Lagt til i «'+p.name+'»')}
    else if(m==='newadd')newPl(id);
    else if(m==='next'){const i=S.queue.indexOf(id);if(i>-1&&i!==S.qi){S.queue.splice(i,1);if(i<S.qi)S.qi--}if(id!==curId())S.queue.splice(S.qi+1,0,id);toast('Spilles som neste');close()}
    else if(m==='rm'){const p=S.pls.find(p=>p.id===S.pl);p.song_ids=p.song_ids.filter(x=>x!==id);close();render();savePl(p)}
    else if(m==='edit')edit(id);
    else if(m==='share'){close();const {error}=await sb.from('ml_songs').update({shared:!s.shared}).eq('id',id);if(error)return toast('Kunne ikke endre');s.shared=!s.shared;render();toast(s.shared?'Låten er nå delt med alle':'Låten er ikke delt lenger')}
    else if(m==='hide'){close();hide(id,true)}
    else if(m==='unhide'){close();hide(id,false)}
    else if(m==='del')confirmBox(s.shared?`«${s.title}» er en felles låt. Sletter du den, forsvinner den for alle.`:own?`Slette «${s.title}»? Den forsvinner fra spillelistene dine også.`:`Slette «${s.title}» for godt? Den forsvinner for eieren også.`,'Slett',()=>delSong(id));
  }});
}
function edit(id){const s=song(id);
  modal(`<form><h2>Endre låt</h2><label class="field"><span>Navn på låten</span><input name="title" value="${esc(s.title)}" maxlength="120" required></label><label class="field"><span>Artist</span><input name="artist" value="${esc(s.artist)}" maxlength="120"></label><label class="field"><span>Album</span><input name="album" value="${esc(s.album)}" maxlength="120"></label><div class="acts"><button type="button" class="btn ghost" data-m="close">Avbryt</button><button class="btn">Lagre</button></div></form>`,
  {submit:async f=>{const ch={title:f.get('title').trim()||s.title,artist:f.get('artist').trim(),album:f.get('album').trim()};close();const {error}=await sb.from('ml_songs').update(ch).eq('id',id);if(error)return toast('Kunne ikke lagre');Object.assign(s,ch);render();now();toast('Lagret')}});
}
function ask(title,val,cb){modal(`<form><h2>${esc(title)}</h2><label class="field"><span>Navn</span><input name="v" value="${esc(val)}" maxlength="80" required></label><div class="acts"><button type="button" class="btn ghost" data-m="close">Avbryt</button><button class="btn">Lagre</button></div></form>`,{submit:f=>{const v=f.get('v').trim();if(v){close();cb(v)}}})}
function confirmBox(text,yes,cb){modal(`<h2>Er du sikker?</h2><p>${esc(text)}</p><div class="acts"><button class="btn ghost" data-m="close">Avbryt</button><button class="btn" data-m="yes">${esc(yes)}</button></div>`,{act:m=>{if(m==='yes'){close();cb()}}})}
function newPl(addId){ask('Ny spilleliste','Spilleliste '+(S.pls.length+1),async name=>{const {data,error}=await sb.from('ml_playlists').insert({name,song_ids:addId?[addId]:[]}).select().single();if(error)return toast('Kunne ikke lage spillelista');S.pls.push(data);render();toast(addId?'Lagt til i «'+name+'»':'Spillelista er laget')})}
function renPl(){const p=S.pls.find(p=>p.id===S.pl);if(p)ask('Gi nytt navn',p.name,name=>{p.name=name;render();savePl(p)})}
function delPl(){const p=S.pls.find(p=>p.id===S.pl);if(p)confirmBox(`Slette spillelista «${p.name}»? Låtene blir liggende i biblioteket.`,'Slett liste',async()=>{const {error}=await sb.from('ml_playlists').delete().eq('id',p.id);if(error)return toast('Kunne ikke slette');S.pls=S.pls.filter(x=>x!==p);S.pl=null;render()})}
async function delSong(id){
  const s=song(id);if(!s)return;
  const {error}=await sb.from('ml_songs').delete().eq('id',id);if(error)return toast('Kunne ikke slette låten');
  sb.storage.from(B).remove([s.file_path,s.cover_path].filter(Boolean));
  const wasCur=id===curId();
  S.songs=S.songs.filter(x=>x.id!==id);S.likes.delete(id);
  for(const p of S.pls)if(p.song_ids.includes(id)){p.song_ids=p.song_ids.filter(x=>x!==id);savePl(p)}
  const i=S.queue.indexOf(id);if(i>-1){S.queue.splice(i,1);S.base=S.base.filter(x=>x!==id);if(i<S.qi)S.qi--}
  if(wasCur){audio.pause();audio.removeAttribute('src');if(S.qi>=S.queue.length)S.qi=S.queue.length-1;if(S.queue.length)load1(false);else{S.qi=-1;now()}}
  toast('Låten er slettet');render();
}

/* ---------- vindu for valg ---------- */
let H={};
function modal(html,h){H=h||{};$('#sheet').innerHTML=html;$('#modal').hidden=false;const i=$('#sheet input[type=text],#sheet input:not([type])');if(i){i.focus();i.select()}}
function close(){$('#modal').hidden=true;$('#sheet').innerHTML='';H={}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')return close();const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='close')return close();H.act&&H.act(b.dataset.m,b)});
$('#sheet').addEventListener('submit',e=>{e.preventDefault();H.submit&&H.submit(new FormData(e.target))});

/* ---------- spilleren ---------- */
const audio=new Audio();audio.preload='auto';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQueue(ids,i){S.base=[...ids];const first=ids[i];S.queue=S.shuffle?[first,...shuffle(ids.filter((_,k)=>k!==i))]:[...ids];S.qi=S.shuffle?0:i;load1(true)}
function load1(go){
  const s=song(curId());if(!s)return;now();render();
  const u=fresh(s.file_path);
  if(u){audio.src=u;if(go)audio.play().catch(()=>{});return}
  signOne(s.file_path).then(u=>{if(curId()!==s.id)return;audio.src=u;if(go)audio.play().catch(()=>toast('Trykk på play for å starte'))}).catch(()=>toast('Kunne ikke hente låten'));
}
function toggle(){if(!curId()){const L=visible();if(L.length)startQueue(L.map(s=>s.id),0);return}if(audio.paused)audio.play().catch(()=>{});else audio.pause()}
function next(auto){if(!S.queue.length)return;if(S.qi<S.queue.length-1)S.qi++;else if(S.repeat===1||!auto)S.qi=0;else{audio.pause();audio.currentTime=0;return}load1(true)}
function prev(){if(!S.queue.length)return;if(audio.currentTime>3){audio.currentTime=0;return}S.qi=S.qi>0?S.qi-1:(S.repeat===1?S.queue.length-1:0);load1(true)}
function modes(){$$('[data-pc=shuf]').forEach(b=>b.classList.toggle('on',S.shuffle));$$('[data-pc=rep]').forEach(b=>{b.classList.toggle('on',S.repeat>0);b.querySelector('.badge').hidden=S.repeat!==2;b.setAttribute('aria-label',['Gjenta: av','Gjenta: alle','Gjenta: én låt'][S.repeat])})}
function reshuffle(){const c=curId();if(!c)return;if(S.shuffle){S.queue=[c,...shuffle(S.queue.filter(x=>x!==c))];S.qi=0}else{S.queue=[...S.base];S.qi=Math.max(0,S.queue.indexOf(c))}}
function now(){
  const s=me&&song(curId());$('#bar').hidden=!s;if(!s){$('#np').hidden=true;return}
  $('#bcov').innerHTML=cov(s);$('#npart').innerHTML=cov(s,'cv art');
  $('#btitle').textContent=$('#ntitle').textContent=s.title;
  $('#bart').textContent=$('#nart').textContent=s.artist||'Ukjent artist';
  const liked=S.likes.has(s.id);
  $$('[data-pc=like]').forEach(b=>{b.classList.toggle('on',liked);b.innerHTML=liked?I.heartF:I.heart});
  $('#np').style.setProperty('--h',hue(s.album||s.title));
  document.title=s.title+' · Songify';
  const cu=s.cover_path&&fresh(s.cover_path);
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:cu?[{src:cu,sizes:'512x512'}]:[{src:'/icon-512.png',sizes:'512x512',type:'image/png'}]})}catch{}}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pc]');if(!b)return;const c=b.dataset.pc;
  if(c==='play')toggle();else if(c==='next')next(false);else if(c==='prev')prev();
  else if(c==='shuf'){S.shuffle=!S.shuffle;reshuffle();modes();toast(S.shuffle?'Tilfeldig rekkefølge på':'Tilfeldig rekkefølge av')}
  else if(c==='rep'){S.repeat=(S.repeat+1)%3;modes();toast(['Gjenta av','Gjentar hele lista','Gjentar denne låten'][S.repeat])}
  else if(c==='like'){if(curId())like(curId())}
  else if(c==='open')$('#np').hidden=false;else if(c==='close')$('#np').hidden=true;
});
audio.addEventListener('play',()=>document.body.classList.add('playing'));
audio.addEventListener('pause',()=>document.body.classList.remove('playing'));
audio.addEventListener('ended',()=>{if(S.repeat===2){audio.currentTime=0;audio.play().catch(()=>{})}else next(true)});
audio.addEventListener('error',()=>{if(audio.getAttribute('src'))toast('Denne låten kan ikke spilles i denne nettleseren')});
let drag=false;
audio.addEventListener('timeupdate',()=>{const d=audio.duration||0,t=audio.currentTime,p=d?t/d:0;
  if(!drag)$$('.seek').forEach(r=>r.value=Math.round(p*1000));
  $$('.tcur').forEach(e=>e.textContent=fmt(t));$$('.tdur').forEach(e=>e.textContent=fmt(d));$('#mini').style.width=(p*100)+'%'});
$$('.seek').forEach(r=>{r.addEventListener('input',()=>{drag=true;$$('.tcur').forEach(e=>e.textContent=fmt(r.value/1000*(audio.duration||0)))});r.addEventListener('change',()=>{drag=false;if(audio.duration)audio.currentTime=r.value/1000*audio.duration})});
let vol=90;try{vol=+(localStorage.getItem('ml-vol')??90)}catch{}
const setVol=v=>{vol=v;audio.volume=v/100;$$('.volr').forEach(r=>r.value=v)};setVol(vol);
$$('.volr').forEach(r=>r.addEventListener('input',()=>{setVol(+r.value);try{localStorage.setItem('ml-vol',r.value)}catch{}}));
if('mediaSession' in navigator){const ms=navigator.mediaSession;[['play',()=>audio.play()],['pause',()=>audio.pause()],['nexttrack',()=>next(false)],['previoustrack',prev],['seekto',d=>{audio.currentTime=d.seekTime}]].forEach(([a,f])=>{try{ms.setActionHandler(a,f)}catch{}})}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)close();else $('#np').hidden=true;return}
  if(!me||e.target.closest('input,textarea,button'))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
});
modes();start();
}
</script>
</body></html>
