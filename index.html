<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Songify</title>
<!-- versjon 15: fortsetter der du slapp -->
<meta name="theme-color" content="#141017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Songify">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f1ec,#141017);--pan:light-dark(#fffdfb,#1e1922);--pan2:light-dark(#ece3da,#2a2330);--ink:light-dark(#1b1418,#f5eee9);--mut:light-dark(#6a5f66,#a99ea7);--acc:light-dark(#cf3d17,#ff6a3d);--on:light-dark(#fff,#1b0d08);--line:light-dark(#e2d7cd,#2f2834)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip;padding-bottom:130px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2{line-height:1.05;margin:0;text-wrap:balance}
svg{display:block}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(12px + env(safe-area-inset-top)) max(4vw,16px) 10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;margin-right:auto}
.logo img{width:36px;height:36px;border-radius:9px}
.search{flex:1 1 220px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--pan2);border-radius:999px;padding:0 16px;height:44px;color:var(--mut);order:3}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;background:var(--acc);color:var(--on);font-weight:600;white-space:nowrap}
.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--pan2);color:var(--ink)}
.btn:disabled{opacity:.6}
.acc{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:18px}
.tabs{display:flex;gap:8px;padding:0 max(4vw,16px) 10px;overflow-x:auto;background:var(--bg)}
.tabs button{flex:none;height:40px;padding:0 18px;border-radius:999px;background:var(--pan2);font-weight:500}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{padding:6px max(4vw,16px) 24px;max-width:1240px;margin:0 auto}
.hero{display:flex;gap:24px;align-items:flex-end;padding:clamp(20px,3vw,32px);border-radius:22px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,hsl(var(--h) 70% 46%),hsl(calc(var(--h) + 45) 60% 22%))}
.hero .art{width:clamp(110px,18vw,180px);height:auto;aspect-ratio:1;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.35);font-size:56px;flex:none}
.hero .art svg{width:45%;height:45%}
.hero h1{font-size:clamp(32px,5vw,52px)}
.kind{margin:0 0 6px;font-size:14px;opacity:.85}
.hero p{margin:6px 0 0}
.hb{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.back{height:44px;color:var(--mut);font-weight:500;margin-bottom:6px}
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:32px 48px minmax(0,1fr) minmax(0,.6fr) 44px 52px 44px;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;cursor:pointer}
.row:hover{background:var(--pan2)}
.row.cur b{color:var(--acc)}
.row.dim{opacity:.55}
.n{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.cv{width:48px;height:48px;border-radius:8px;object-fit:cover;display:grid;place-items:center;font-weight:700;color:#fff;font-size:20px;flex:none}
.gen{background:linear-gradient(135deg,hsl(var(--h) 75% 56%),hsl(calc(var(--h) + 50) 65% 28%))}
.tt b,.tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt b{font-weight:500}
.tt small,.al,.du{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;background:var(--pan2);color:var(--ink);margin-right:6px;line-height:18px;vertical-align:1px}
.tag.f{background:color-mix(in srgb,var(--acc) 22%,transparent)}
.al{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.du{text-align:right;font-variant-numeric:tabular-nums}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--mut);position:relative}
.ic svg{width:22px;height:22px}
.ic:hover{color:var(--ink)}
.ic.on,.heart.on{color:var(--acc)}
.badge{position:absolute;top:6px;right:5px;font-size:10px;font-weight:700;background:var(--acc);color:var(--on);border-radius:8px;padding:0 4px;line-height:14px}
.none{color:var(--mut);padding:24px 8px}
.meter{color:var(--mut);font-size:14px;margin:22px 8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{text-align:left;padding:12px;border-radius:16px;background:var(--pan);border:1px solid var(--line)}
.card:hover{background:var(--pan2)}
.card .cv{width:100%;height:auto;aspect-ratio:1;font-size:48px;margin-bottom:10px;border-radius:10px}
.card .cv svg{width:40%;height:40%}
.card b,.card small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--mut);font-size:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:10px 0 18px}
.head h1{font-size:clamp(32px,5vw,48px)}.head p{margin:6px 0 0;color:var(--mut)}
.empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,64px);align-items:center;padding:clamp(24px,5vw,64px) 0}
.empty h1{font-size:clamp(34px,5vw,52px);margin-bottom:14px}
.empty p{color:var(--mut);max-width:52ch}
.vinyl{width:100%;max-width:380px;margin:auto;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{color:var(--mut);padding:60px 8px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--pan);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:16px;padding:10px max(3vw,12px) calc(10px + env(safe-area-inset-bottom))}
.now{display:flex;align-items:center;gap:12px;text-align:left;min-height:48px}
.now .tt{flex:1;text-align:left}
.ctl{display:flex;flex-direction:column;align-items:center;gap:2px}
.btns{display:flex;align-items:center;gap:4px}
.play{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.i-pause,.playing .i-play{display:none}.playing .i-pause{display:block}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.prog span{min-width:36px}.prog span:last-child{text-align:right}
input[type=range]{accent-color:var(--acc);width:100%;height:24px;margin:0}
.vol{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.vol input{max-width:130px}
.mini{display:none}
.np{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));overflow:auto;background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--h,20) 70% 50%) 45%,var(--bg)),var(--bg) 68%)}
.np .tophd{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.stage{width:100%;max-width:520px;display:grid;grid-template-columns:minmax(0,1fr) 52px;align-items:center;gap:8px}
.deck{position:relative;width:min(64vw,44vh,420px);aspect-ratio:1;margin:auto}
.disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#0c0b0e 0 17%,transparent 17.5%),repeating-radial-gradient(circle,#141317 0 1.6px,#1d1b21 2.2px 3.4px);box-shadow:0 28px 60px rgba(0,0,0,.45),inset 0 0 0 2px #000;animation:spin 1.8s linear infinite;animation-play-state:paused}
.playing .disc,.playing .bar .cv{animation-play-state:running}
.disc .lab{position:absolute;inset:31%;border-radius:50%;overflow:hidden}
.disc .lab .cv{width:100%;height:100%;border-radius:50%;font-size:clamp(28px,7vw,54px)}
.disc .lab::after{content:"";position:absolute;left:50%;top:50%;width:9%;height:9%;margin:-4.5% 0 0 -4.5%;border-radius:50%;background:#0c0b0e;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(from 20deg,transparent 0 8%,rgba(255,255,255,.10) 12%,transparent 18% 50%,rgba(255,255,255,.08) 62%,transparent 68%)}
.arm{position:absolute;right:-6%;top:-6%;width:46%;height:auto;transform-origin:82% 14%;transform:rotate(-24deg);transition:transform .7s ease;pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.playing .arm{transform:rotate(0deg)}
.vvol{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--mut)}
.vvol input{writing-mode:vertical-lr;direction:rtl;width:32px;height:min(200px,30vh)}
.np .prog,.np .btns,.np .info,.np .extra{width:100%;max-width:460px}
.extra{display:flex;justify-content:center}
.eqv{display:grid;grid-template-columns:auto minmax(0,1fr) 64px;gap:12px;align-items:center;margin:6px 0}
.eqv b{font-weight:600}.eqv output{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}.pre button{height:40px;padding:0 14px;border-radius:999px;background:var(--pan2)}.pre button.on{background:var(--acc);color:var(--on)}
.eqb{font-size:13px;font-weight:700;letter-spacing:.02em}
.tools{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:0 0 8px;flex-wrap:wrap}
.sort{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14px}
.sort select{height:40px;border-radius:999px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);font:inherit;font-size:15px;padding:0 14px}
.cb{width:32px;height:44px;display:grid;place-items:center}
.cb i{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);display:grid;place-items:center;transition:.12s}
.cb i svg{width:14px;height:14px;color:var(--on)}
.row.on .cb i{background:var(--acc);border-color:var(--acc)}
.cb:hover i{border-color:var(--ink)}
.cw{position:relative;display:block;flex:none}
.ck{position:absolute;right:-5px;bottom:-5px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.45);display:grid;place-items:center}
.ck svg{width:14px;height:14px;color:#fff}
.row.on{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.row.on .ck{background:var(--acc);border-color:var(--acc)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--pan);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:12px max(3vw,12px) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.selbar b{margin-right:auto;font-size:17px}

.qi{display:flex;gap:12px;align-items:center;padding:6px 0}.qi .tt{flex:1}.qi .cv{width:44px;height:44px}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.psel{flex:1;min-width:0;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--pan2);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.tag.o{background:color-mix(in srgb,#2fa86b 28%,transparent)}
.offbar{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--pan2);font-size:15px}
.chip{min-height:40px;padding:0 16px;border-radius:999px;background:var(--pan2);font-size:14px;margin:0 0 12px}
@media(max-width:700px){.selbar .btn{height:40px;padding:0 14px;font-size:15px}.selbar b{flex-basis:100%}}
.np .info{width:100%;max-width:460px;display:flex;align-items:center;gap:8px}
.np .info .tt{flex:1}.np .info b{font-size:24px;font-weight:600}.np .info small{font-size:16px}
.np .prog,.np .btns,.np .vol{width:100%;max-width:460px}
.np .btns{justify-content:space-between}
.np .play{width:68px;height:68px}.np .play svg{width:32px;height:32px}
.np .vol{justify-content:center}.np .vol input{max-width:none}
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,6,12,.55);display:grid;place-items:end center}
.sheet{background:var(--pan);width:min(100%,460px);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:24px;margin-bottom:14px}
.mh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.lbl{color:var(--mut);font-size:14px;margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.opts button{height:40px;padding:0 14px;border-radius:999px;background:var(--pan2)}
.line{display:block;width:100%;text-align:left;min-height:48px;padding:0 10px;border-radius:10px}
.line:hover{background:var(--pan2)}
.danger{color:#e5484d}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.field input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--pan2);margin:10px 0}
.check input{width:22px;height:22px;accent-color:var(--acc);flex:none;margin-top:1px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.drop{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--acc) 85%,transparent);color:#fff;display:grid;place-items:center;font-size:clamp(26px,4vw,40px);font-weight:700;pointer-events:none}
.toast{position:fixed;left:50%;bottom:140px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:50;transition:.25s;font-size:15px;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.acard{width:min(100%,420px);text-align:center}
.acard .vinyl{max-width:180px;margin-bottom:20px}
.acard h1{font-size:clamp(34px,6vw,46px);margin-bottom:8px}
.acard p{color:var(--mut);margin:0 0 20px}
.acard form{text-align:left}
.acard .btn{width:100%;margin-top:4px}
.links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.links button{color:var(--acc);font-weight:500;min-height:44px}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--pan2);font-size:15px;text-align:left}
.msg.err{background:color-mix(in srgb,#e5484d 18%,transparent)}
.setup{max-width:560px;margin:60px auto;padding:0 20px}
@media(max-width:700px){
 .bar .cv{border-radius:50%;animation:spin 1.8s linear infinite;animation-play-state:paused}
 .row{grid-template-columns:48px minmax(0,1fr) 44px 44px;gap:10px;padding:6px 4px}.n,.al,.du{display:none}
 .hero{flex-direction:column;align-items:flex-start}
 .empty{grid-template-columns:1fr}.empty .vinyl{max-width:200px}
 .bar{grid-template-columns:minmax(0,1fr) auto;padding-top:12px}
 .bar .prog,.bar .vol,.bar .side{display:none}
 .mini{display:block;position:absolute;top:0;left:0;height:3px;background:var(--acc)}
 .top .btn span{display:none}.top .btn{padding:0 14px}
 .search{max-width:none}
}
@media(prefers-reduced-motion:reduce){.vinyl,.disc,.bar .cv{animation:none}.arm{transition:none}.toast{transition:none}}
</style></head><body>

<div class="setup" id="setup" hidden><h1>Nesten klar!</h1><p>Appen mangler koblingen til Supabase. Åpne filen <b>config.js</b>, lim inn Project URL og anon key fra Supabase, og send endringen til GitHub (Commit og Push origin).</p></div>

<section class="auth" id="auth">
  <div class="acard"><div id="avinyl"></div><h1>Songify</h1><p id="asub">Starter appen …</p></div>
</section>

<div id="app" hidden>
<header class="top">
  <div class="logo"><img src="/icon-192.png" alt="">Songify</div>
  <button class="btn" id="up" aria-label="Last opp låter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 16V4m0 0-5 5m5-5 5 5M4 20h16"/></svg><span>Last opp</span></button>
  <button class="acc" id="acc" aria-label="Kontoen min"></button>
  <label class="search"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Søk etter låt, artist eller album" aria-label="Søk"></label>
  <input type="file" id="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.oga,.opus" multiple hidden>
</header>
<nav class="tabs"><button data-tab="pl">Album og lister</button><button data-tab="liked">Likte låter</button><button data-tab="shared">Felles</button><button data-tab="all" id="taball" hidden>Alle brukere</button></nav>
<main id="view"><p class="loading">Henter låtene dine …</p></main>
</div>

<footer class="bar" id="bar" hidden>
  <div class="mini" id="mini"></div>
  <div class="now"><button data-pc="open" aria-label="Åpne spiller" id="bcov"></button><button class="tt" data-pc="open"><b id="btitle"></b><small id="bart"></small></button><button class="ic heart side" data-pc="like" aria-label="Lik låten"></button></div>
  <div class="ctl">
    <div class="btns"><button class="ic side" data-pc="shuf" aria-label="Tilfeldig rekkefølge"></button><button class="ic side" data-pc="prev" aria-label="Forrige"></button><button class="play" data-pc="play" aria-label="Spill / pause"></button><button class="ic" data-pc="next" aria-label="Neste"></button><button class="ic side" data-pc="rep" aria-label="Gjenta"></button></div>
    <div class="prog"><span class="tcur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0" aria-label="Spol"><span class="tdur">0:00</span></div>
  </div>
  <div class="vol"><button class="ic eqb" data-pc="queue" aria-label="Kø">KØ</button><button class="ic eqb" data-pc="eq" aria-label="Bass og diskant">EQ</button><span class="ic vi"></span><input class="volr" type="range" min="0" max="100" value="90" aria-label="Volum"></div>
</footer>

<section class="np" id="np" hidden>
  <div class="tophd"><button class="ic" data-pc="close" aria-label="Lukk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button><span>Spilles nå</span><span style="width:44px"></span></div>
  <div class="stage">
    <div class="deck"><div class="disc"><div class="lab" id="npart"></div></div><div class="sheen"></div>
      <svg class="arm" viewBox="0 0 120 160" aria-hidden="true"><circle cx="98" cy="22" r="16" fill="#3a3540"/><circle cx="98" cy="22" r="7" fill="#9a929f"/><path d="M98 22 L84 112 L58 138" stroke="#c9c2cc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="42" y="130" width="24" height="16" rx="3" transform="rotate(38 54 138)" fill="#ff6a3d"/></svg></div>
    <div class="vvol"><span class="vi" style="width:22px"></span><input class="volr" type="range" min="0" max="100" value="90" aria-label="Lydnivå"><small>Lyd</small></div>
  </div>
  <div class="info"><div class="tt"><b id="ntitle"></b><small id="nart"></small></div><button class="ic heart" data-pc="like" aria-label="Lik låten"></button></div>

/* signerte lenker til filene (gyldige i 12 timer) */
const signed=new Map();
const fresh=p=>{const x=signed.get(p);return x&&x.exp>Date.now()+120000?x.u:null};
async function signMany(paths){
  paths=[...new Set(paths.filter(p=>p&&!fresh(p)))];
  for(let i=0;i<paths.length;i+=200){
    const {data}=await sb.storage.from(B).createSignedUrls(paths.slice(i,i+200),43200);
    (data||[]).forEach(d=>{if(d.signedUrl&&!d.error)signed.set(d.path,{u:d.signedUrl,exp:Date.now()+43200e3})});
  }
}
async function signOne(p){const u=fresh(p);if(u)return u;const {data,error}=await sb.storage.from(B).createSignedUrl(p,43200);if(error)throw error;signed.set(p,{u:data.signedUrl,exp:Date.now()+43200e3});return data.signedUrl}
const cov=(s,cls='cv')=>{const u=s&&s.cover_path&&fresh(s.cover_path);return u?`<img class="${cls}" src="${esc(u)}" alt="" loading="lazy">`:`<div class="${cls} gen" style="--h:${hue((s&&(s.album||s.title))||'x')}">${esc(((s&&s.title)||'?').trim().charAt(0).toUpperCase()||'?')}</div>`};

}

/* ---------- offline og nedlasting ---------- */
const OC='songify-offline';
const offKey=id=>'/offline/'+id, offCov=id=>'/offline/cover/'+id;
function saveCache(){try{localStorage.setItem('ml-cache',JSON.stringify({uid:me.id,admin,name:myName,songs:S.songs,hidden:[...S.hidden],likes:[...S.likes],pls:S.pls}))}catch{}}
function readCache(){try{return JSON.parse(localStorage.getItem('ml-cache')||'null')}catch{return null}}
function useCache(k){S.songs=k.songs||[];S.hidden=new Set(k.hidden||[]);S.likes=new Set(k.likes||[]);S.pls=(k.pls||[]).filter(p=>p.owner===me.id||p.shared)}
async function offInit(){
  if(!('caches' in window))return;
  try{const c=await caches.open(OC);for(const r of await c.keys()){const p=new URL(r.url).pathname;if(p.startsWith('/offline/')&&!p.startsWith('/offline/cover/'))S.off.add(p.slice(9))}}catch{}
}
async function offCovers(){
  if(!('caches' in window))return;
  try{const c=await caches.open(OC);
    for(const s of S.songs){if(!s.cover_path||!S.off.has(s.id))continue;const x=signed.get(s.cover_path);if(x&&x.exp===Infinity)continue;const r=await c.match(offCov(s.id));if(r)signed.set(s.cover_path,{u:URL.createObjectURL(await r.blob()),exp:Infinity})}
  }catch{}
}
async function songBlob(s){
  if('caches' in window){try{const r=await (await caches.open(OC)).match(offKey(s.id));if(r)return await r.blob()}catch{}}
  const u=await signOne(s.file_path);const res=await fetch(u);if(!res.ok)throw new Error('HTTP '+res.status);return await res.blob();
}
async function saveOffline(s){
  const c=await caches.open(OC);
  const b=await songBlob(s);
  await c.put(offKey(s.id),new Response(b,{headers:{'Content-Type':b.type||'audio/mpeg'}}));
  if(s.cover_path){try{const u=await signOne(s.cover_path);const r=await fetch(u);if(r.ok)await c.put(offCov(s.id),new Response(await r.blob()))}catch{}}
  S.off.add(s.id);
}
async function dropOffline(ids){try{const c=await caches.open(OC);for(const id of ids){await c.delete(offKey(id));await c.delete(offCov(id));S.off.delete(id)}}catch{}}
const plSongs=p=>p.song_ids.map(song).filter(Boolean);
const offAll=p=>{const L=plSongs(p);return L.length>0&&L.every(s=>S.off.has(s.id))};
function offLabel(p){const L=plSongs(p),k=L.filter(s=>S.off.has(s.id)).length;return !L.length?'Last ned offline':k===L.length?'✓ Offline – fjern':k?`Last ned resten offline (${k}/${L.length})`:'Last ned offline'}
async function offlinePl(){
  const p=curPl();if(!p)return;
  if(!('caches' in window))return toast('Denne nettleseren kan ikke lagre offline');
  const L=plSongs(p);if(!L.length)return toast('Albumet er tomt');
  if(offAll(p))return confirmBox(`Fjerne «${p.name}» fra offline? Låtene kan fortsatt spilles når du har nett.`,'Fjern offline',async()=>{await dropOffline(L.map(s=>s.id));render();toast('Fjernet fra offline')});
  if(S.offline)return toast('Du må ha nett for å laste ned');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  const todo=L.filter(s=>!S.off.has(s.id));let n=0,fail=0;
  for(const s of todo){toast(`Laster ned offline ${++n} av ${todo.length} …`,true);try{await saveOffline(s)}catch(e){console.error(e);fail++}}
  await offCovers();render();
  toast(fail?`${todo.length-fail} lagret offline, ${fail} feilet`:`«${p.name}» kan nå spilles uten nett`);
}
async function downloadSong(s){
  toast('Henter låten …',true);
  try{
    const b=await songBlob(s);const ext=(s.file_path.split('.').pop()||'mp3').toLowerCase();
    const name=((s.artist?s.artist+' - ':'')+s.title).replace(/[\\/:*?"<>|]/g,'').trim()+'.'+ext;
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000);
    toast('Lastet ned: '+name);
  }catch(e){console.error(e);toast('Kunne ikke laste ned låten')}
}
function plPicker(){
  const own=S.pls.filter(ownPl);
  return own.length?`<div class="addrow"><select id="plsel" class="psel" aria-label="Velg album">${own.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><button class="btn" data-m="addsel">Legg til</button></div>`:'';
}

  :`<form id="adminform"><p class="lbl">Er du admin? Skriv inn admin-koden.</p><label class="field"><span>Admin-kode</span><input name="code" type="password" autocomplete="off"></label><button class="btn ghost">Bli admin</button></form>`}

/* ---------- ID3: navn, artist, album og cover fra MP3 ---------- */
const syncsafe=(b,i)=>(b[i]&127)<<21|(b[i+1]&127)<<14|(b[i+2]&127)<<7|(b[i+3]&127);
const be32=(b,i)=>(b[i]<<24|b[i+1]<<16|b[i+2]<<8|b[i+3])>>>0;
const dec=(d,enc)=>{try{const lab=enc===1?'utf-16':enc===2?'utf-16be':enc===3?'utf-8':'iso-8859-1';return new TextDecoder(lab).decode(d).replace(/\u0000/g,' ').trim()}catch{return ''}};
async function readTags(file){
  const b=new Uint8Array(await file.slice(0,Math.min(file.size,3e6)).arrayBuffer());
  if(b[0]!==73||b[1]!==68||b[2]!==51)return {};
  const ver=b[3];if(ver<3)return {};
  const end=Math.min(10+syncsafe(b,6),b.length);let p=10;const o={};
  if(b[5]&64)p+=ver===4?syncsafe(b,10):be32(b,10)+4;
  while(p+10<end){
    const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
    const fs=ver===4?syncsafe(b,p+4):be32(b,p+4);const d=b.subarray(p+10,p+10+fs);p+=10+fs;if(!fs)continue;
    if(id==='TIT2')o.title=dec(d.subarray(1),d[0]);else if(id==='TPE1')o.artist=dec(d.subarray(1),d[0]);else if(id==='TALB')o.album=dec(d.subarray(1),d[0]);
    else if(id==='APIC'&&!o.cover){
      const enc=d[0];let i=1;while(i<d.length&&d[i]!==0)i++;
      let mime=dec(d.subarray(1,i),0)||'image/jpeg';if(!mime.includes('/'))mime='image/'+mime.toLowerCase().replace('jpg','jpeg');
      i+=2;
      if(enc===1||enc===2){while(i+1<d.length&&!(d[i]===0&&d[i+1]===0))i+=2;i+=2}else{while(i<d.length&&d[i]!==0)i++;i++}
      if(i<d.length)o.cover=new Blob([d.slice(i)],{type:mime});
    }
  }
  return o;
}

let drag=false;
audio.addEventListener('timeupdate',()=>{const d=audio.duration||0,t=audio.currentTime,p=d?t/d:0;
  if(!drag)$$('.seek').forEach(r=>r.value=Math.round(p*1000));
  $$('.tcur').forEach(e=>e.textContent=fmt(t));$$('.tdur').forEach(e=>e.textContent=fmt(d));$$('.trem').forEach(e=>e.textContent='-'+fmt(Math.max(0,d-t)));$('#mini').style.width=(p*100)+'%'});
$$('.seek').forEach(r=>{r.addEventListener('input',()=>{drag=true;$$('.tcur').forEach(e=>e.textContent=fmt(r.value/1000*(audio.duration||0)))});r.addEventListener('change',()=>{drag=false;if(audio.duration)audio.currentTime=r.value/1000*audio.duration})});
/* ---------- lydnivå og equalizer (bass og diskant) ---------- */
let vol=90;try{vol=+(localStorage.getItem('ml-vol')??90)}catch{}
let EQ={bass:0,treble:0};try{Object.assign(EQ,JSON.parse(localStorage.getItem('ml-eq')||'{}'))}catch{}
let G=null;
function graph(){
  if(G)return G;
  try{
    const C=new (window.AudioContext||window.webkitAudioContext)();
    const src=C.createMediaElementSource(audio);
    const bass=C.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=180;
    const treble=C.createBiquadFilter();treble.type='highshelf';treble.frequency.value=3500;
    const pre=C.createGain(),out=C.createGain();
    src.connect(pre);pre.connect(bass);bass.connect(treble);treble.connect(out);out.connect(C.destination);
    G={C,bass,treble,pre,out};audio.volume=1;applyAudio();
  }catch(e){console.error(e)}
  return G;
}
const eqOn=()=>EQ.bass!==0||EQ.treble!==0;
function applyAudio(){
  if(!G){audio.volume=vol/100;return}
  const t=G.C.currentTime,boost=Math.max(0,EQ.bass,EQ.treble);
  G.bass.gain.setTargetAtTime(EQ.bass,t,.03);G.treble.gain.setTargetAtTime(EQ.treble,t,.03);
  G.pre.gain.setTargetAtTime(Math.pow(10,-boost*.6/20),t,.03);
  G.out.gain.setTargetAtTime((vol/100)**1.6,t,.03);
}
const wake=()=>{if(G&&G.C.state!=='running')G.C.resume().catch(()=>{})};
audio.addEventListener('play',()=>{if(eqOn())graph();wake()});
document.addEventListener('visibilitychange',wake);
const setVol=v=>{vol=v;$$('.volr').forEach(r=>r.value=v);applyAudio()};setVol(vol);
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(IOS){$$('.volr').forEach(r=>r.hidden=true);$$('.vvol').forEach(e=>e.hidden=true);$$('.vol .vi').forEach(e=>e.hidden=true)}  // iPhone: bruk volumknappene på telefonen
$$('.volr').forEach(r=>r.addEventListener('input',()=>{wake();setVol(+r.value);try{localStorage.setItem('ml-vol',r.value)}catch{}}));
const PRE=[['Normal',0,0],['Mer bass',6,0],['Bass-boost',10,2],['Klar lyd',-2,5],['Myk',2,-5]];
function eqSheet(){
  const row=(k,l)=>`<div class="eqv"><b>${l}</b><input type="range" min="-12" max="12" step="1" value="${EQ[k]}" data-eq="${k}" aria-label="${l}"><output id="o-${k}"></output></div>`;
  modal(`<h2>Bass og diskant</h2>${row('bass','Bass')}${row('treble','Diskant')}<div class="pre">${PRE.map(p=>`<button data-m="pre" data-b="${p[1]}" data-t="${p[2]}">${p[0]}</button>`).join('')}</div><p style="color:var(--mut);font-size:14px;margin:10px 0 0">Endringen høres med en gang og huskes til neste gang.${IOS?' På iPhone kan bass og diskant gjøre at musikken stopper når skjermen låses. Velg «Normal» og lukk appen helt hvis det skjer.':''}</p><button class="line" data-m="close" style="margin-top:8px">Ferdig</button>`,
  {act:(m,b)=>{if(m==='pre')setEq(+b.dataset.b,+b.dataset.t)}});
  $$('#sheet [data-eq]').forEach(r=>r.addEventListener('input',()=>{const o={...EQ};o[r.dataset.eq]=+r.value;setEq(o.bass,o.treble)}));
  showEq();
}
const sgn=v=>(v>0?'+':'')+v+' dB';
function showEq(){
  for(const k of ['bass','treble']){const o=$('#o-'+k);if(o)o.textContent=sgn(EQ[k]);const r=$(`#sheet [data-eq=${k}]`);if(r)r.value=EQ[k]}
  $$('#sheet .pre button').forEach(b=>b.classList.toggle('on',+b.dataset.b===EQ.bass&&+b.dataset.t===EQ.treble));
}
function setEq(b,t){EQ={bass:b,treble:t};try{localStorage.setItem('ml-eq',JSON.stringify(EQ))}catch{}if(eqOn()||G){graph();wake()}applyAudio();showEq()}
if(MS){[['play',()=>{wake();audio.play().catch(()=>{})}],['pause',()=>audio.pause()],['stop',()=>audio.pause()],['nexttrack',()=>next(false)],['previoustrack',()=>{audio.currentTime=0;prev()}],['seekto',d=>{if(d.fastSeek&&audio.fastSeek)audio.fastSeek(d.seekTime);else audio.currentTime=d.seekTime}],['seekbackward',null],['seekforward',null]].forEach(([a,f])=>{try{MS.setActionHandler(a,f)}catch{}})}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').hidden)close();else if(S.sel)endSel();else $('#np').hidden=true;return}
  if(!me||e.target.closest('input,textarea,button'))return;
  if(e.code==='Space'){e.preventDefault();toggle()}
});
modes();start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
</body></html>
